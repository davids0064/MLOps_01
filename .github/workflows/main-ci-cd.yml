name: CI/CD en Main

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unidad_1/punto2_servicio/pacientes

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas unitarias
        run: ./mvnw test

  publish:
    name: Publicar imagen en GitHub Packages
    runs-on: ubuntu-latest
    needs: test
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Publicar imagen Docker en GHCR
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: jhavierc/predicciones-mlops-u2/pacientes
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          workdir: unidad_1/punto2_servicio/pacientes
          snapshot: true
